<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AltaIDE — standalone prototype</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <main class="ide" aria-label="Прототип AltaIDE">
    <header class="topbar" aria-label="Верхняя панель">
      <nav class="menubar" aria-label="Главное меню">
        <img class="alta-logo" src="assets/logo.svg" alt="Alta">
        <div class="menu-links">
          <button type="button">Файл</button><button type="button">Правка</button>
          <button type="button">Вид</button><button type="button">Библиотеки</button>
          <button type="button">Компиляция</button><button type="button">Онлайн</button>
          <button type="button">Отладка</button><button type="button">Инструменты</button>
          <button type="button">Окно</button><button type="button">Справка</button>
        </div>
      </nav>
      <div class="toolbar" role="toolbar" aria-label="Инструменты проекта">
        <div class="toolbar-group">
          <button class="icon-button create-project" type="button" aria-label="Создать проект"><span><img src="assets/top-create-base.svg" alt=""><img src="assets/top-create-stroke.svg" alt=""></span></button>
          <button class="icon-button" type="button" aria-label="Открыть проект"><img src="assets/top-open.svg" alt=""></button>
          <button class="icon-button" type="button" aria-label="Сохранить проект"><img src="assets/top-save.svg" alt=""></button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button class="icon-button" type="button" aria-label="Добавить устройство"><img src="assets/top-add.svg" alt=""></button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button class="icon-button text-tool" type="button" aria-label="Текстовый инструмент">T</button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button class="icon-button" type="button" aria-label="Подключиться"><img src="assets/top-connect.svg" alt=""></button>
          <button class="icon-button" type="button" aria-label="Загрузить в устройство"><img class="load-icon" src="assets/top-loading.svg" alt=""></button>
          <button class="icon-button run-button" type="button" aria-label="Запустить"><img src="assets/top-run.svg" alt=""></button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button class="icon-button" type="button" aria-label="Отладка"><img src="assets/top-create.svg" alt=""></button>
          <span class="toolbar-divider" aria-hidden="true"></span>
        </div>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="Структура проекта">
        <div class="project-head">
          <div class="project-title"><span>Новый проект</span><button type="button" aria-label="Настройки проекта"><img src="assets/sidebar-settings.svg" alt=""></button></div>
          <div class="project-actions">
            <button type="button" aria-label="Информация"><img src="assets/sidebar-info.svg" alt=""></button>
            <button type="button" aria-label="Развернуть всё"><img src="assets/sidebar-expand.svg" alt=""></button>
            <button type="button" aria-label="Свернуть всё"><img src="assets/sidebar-collapse.svg" alt=""></button>
            <button type="button" aria-label="Поиск"><img src="assets/sidebar-search.svg" alt=""></button>
          </div>
        </div>
        <div class="tree" role="tree" aria-label="Дерево проекта">
          <button class="tree-row" style="--level:0" type="button" role="treeitem" aria-expanded="true"><img class="chevron" src="assets/chevron-down.svg" alt=""><img class="tree-icon" src="assets/sidebar-plc.svg" alt=""><span>Устройство (ПЛК)</span></button>
          <button class="tree-row" style="--level:1" type="button" role="treeitem" aria-expanded="true"><img class="chevron" src="assets/chevron-down.svg" alt=""><img class="tree-icon" src="assets/sidebar-pou.svg" alt=""><span>Программные блоки (POU)</span></button>
          <button class="tree-row" style="--level:2" type="button" role="treeitem" aria-expanded="true"><img class="chevron" src="assets/chevron-down.svg" alt=""><img class="tree-icon" src="assets/sidebar-folder.svg" alt=""><span>Новая папка</span></button>
          <button class="tree-row" style="--level:4" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-fb.svg" alt=""><span>compute</span><em>FB</em></button>
          <button class="tree-row is-selected" style="--level:3" type="button" role="treeitem" aria-selected="true"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-fb.svg" alt=""><span>compute</span><em>FB</em></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-fb.svg" alt=""><span>FB</span><em>FB</em></button>
          <button class="tree-row text-only" style="--level:4" type="button" role="treeitem"><span class="chevron-spacer"></span><span class="tree-icon"></span><span>FUN</span><em>FUN</em></button>
          <button class="tree-row" style="--level:1" type="button" role="treeitem" aria-expanded="true"><img class="chevron" src="assets/chevron-down.svg" alt=""><img class="tree-icon" src="assets/sidebar-taskfolder.svg" alt=""><span>Менеджер задач</span></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-cycle.svg" alt=""><span>CYCLE_TASK</span><em>CYCLE</em></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-cycle.svg" alt=""><span>CYCLE_TASK_1</span><em>CYCLE</em></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-task.svg" alt=""><span>TRIGGER_TASK</span><em>TRIGGER</em></button>
          <button class="tree-row" style="--level:1" type="button" role="treeitem" aria-expanded="true"><img class="chevron" src="assets/chevron-down.svg" alt=""><img class="tree-icon" src="assets/sidebar-varfolder.svg" alt=""><span>Списки переменных</span></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-global.svg" alt=""><span>GLV</span><em>GVL</em></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-global.svg" alt=""><span>GLV_1</span><em>GVL</em></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-global.svg" alt=""><span>GLV_2</span><em>GVL</em></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-global.svg" alt=""><span>GLV_3</span><em>GVL</em></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-global.svg" alt=""><span>GLV_4</span><em>GVL</em></button>
          <button class="tree-row" style="--level:1" type="button" role="treeitem" aria-expanded="true"><img class="chevron" src="assets/chevron-down.svg" alt=""><span class="tree-icon type-folder-icon" aria-hidden="true"><img src="assets/sidebar-typefolder.svg" alt=""><img src="assets/sidebar-typefolder-mark.svg" alt=""></span><span>Типы (пользовательские переменные)</span></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-type.svg" alt=""><span>ALIAS</span><em>ALIAS</em></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-type.svg" alt=""><span>ENUM</span><em>ENUM</em></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-type.svg" alt=""><span>STRUCT</span><em>STRUCT</em></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-type.svg" alt=""><span>UNION</span><em>UNION</em></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-type.svg" alt=""><span>UNION_1</span><em>UNION</em></button>
          <button class="tree-row" style="--level:3" type="button" role="treeitem"><span class="chevron-spacer"></span><img class="tree-icon" src="assets/sidebar-type.svg" alt=""><span>UNION_2</span><em>UNION</em></button>
        </div>
      </aside>

      <div class="resizer resizer-vertical" id="vertical-resizer" role="separator" aria-label="Изменить ширину панели проекта" aria-orientation="vertical" tabindex="0"><span></span></div>

      <section class="content-area" aria-label="Рабочая область">
        <div class="editor-tabs" role="tablist" aria-label="Открытые программы">
          <button class="editor-tab is-active" type="button" role="tab" aria-selected="true" data-editor-tab="compute-a"><img src="assets/sidebar-fb.svg" alt=""><span>compute</span><span class="tab-close" aria-hidden="true"></span></button>
          <button class="editor-tab" type="button" role="tab" aria-selected="false" data-editor-tab="compute-b"><img src="assets/sidebar-fb.svg" alt=""><span>compute</span><span class="tab-close" aria-hidden="true"></span></button>
        </div>

        <div class="content-split" id="content-split">
          <section class="code-canvas" aria-label="Редактор кода">
            <div class="code-lines" aria-hidden="true"></div>
            <pre class="source-code"><code><span class="kw">FUNCTION</span> <span class="name">compute</span> <span class="op">:</span> <span class="type">DINT</span>
<span class="kw">VAR_INPUT</span>
  <span class="name">t</span> <span class="op">:</span> <span class="type">INT</span><span class="op">;</span>
<span class="kw">END_VAR</span>
  <span class="name">compute</span> <span class="op">:=</span> <span class="name">t</span> <span class="op">*</span> <span class="num">2</span><span class="op">;</span>
<span class="kw">END_FUNCTION</span></code></pre>
          </section>

          <div class="resizer resizer-horizontal" id="horizontal-resizer" role="separator" aria-label="Изменить высоту нижней панели" aria-orientation="horizontal" tabindex="0"><span></span></div>

          <section class="bottom-panel" aria-label="Нижняя панель">
            <nav class="vertical-tabs" aria-label="Разделы нижней панели">
              <button type="button" data-panel="terminal" aria-label="Терминал"><img src="assets/vertical-log.svg" alt=""></button>
              <button class="is-active" type="button" data-panel="messages" aria-label="Сообщения"><img src="assets/vertical-messages.svg" alt=""></button>
              <button type="button" data-panel="variables" aria-label="Переменные"><img src="assets/vertical-vars.svg" alt=""></button>
            </nav>
            <div class="bottom-content">
              <div class="bottom-tabs" role="tablist" aria-label="Вкладки нижней панели"><button class="is-active" type="button" role="tab" aria-selected="true" id="bottom-tab-label">Сообщения</button><button type="button" role="tab" aria-selected="false">Проблемы</button></div>
              <div class="context-toolbar" role="toolbar" aria-label="Фильтры сообщений">
                <div class="status-counters">
                  <button type="button" aria-label="Ошибки: 0"><img src="assets/context-error.svg" alt=""><span>0</span></button>
                  <button type="button" aria-label="Предупреждения: 0"><img src="assets/context-warning.svg" alt=""><span>0</span></button>
                  <button type="button" aria-label="Информация: 0"><img src="assets/context-info.svg" alt=""><span>0</span></button>
                </div>
                <div class="context-actions"><button type="button" aria-label="Найти"><img src="assets/context-search.svg" alt=""></button><button type="button" aria-label="Фильтр"><img src="assets/context-filter.svg" alt=""></button></div>
                <button class="context-more" type="button" aria-label="Дополнительные действия"><img src="assets/context-more.svg" alt=""></button>
              </div>
              <div class="table-scroll" tabindex="0" aria-label="Таблица сообщений">
                <table class="messages-table">
                  <colgroup><col class="col-type"><col class="col-source"><col class="col-code"><col class="col-description"><col class="col-place"></colgroup>
                  <thead><tr><th>Тип</th><th>Источник</th><th class="sortable">Код<img src="assets/table-sort.svg" alt=""></th><th>Описание</th><th class="sortable">Место<img src="assets/table-sort.svg" alt=""></th></tr></thead>
                  <tbody id="message-rows"></tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
      </section>
    </div>

    <footer class="statusbar" aria-label="Строка состояния"></footer>
  </main>
  <script src="prototype.js"></script>
</body>
</html>
